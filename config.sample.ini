; ============================================================
; dbus-openwb2 - Konfiguration
; Am einfachsten ueber das Web-Interface: http://<venus-ip>:8088
; ============================================================

[DEFAULT]
; Log-Level: ERROR | WARNING | INFO | DEBUG
logging = WARNING
; Name, wie die Wallbox in Venus OS erscheint
device_name = openWB
; VRM-/Geraeteinstanz (eindeutig; 53 ist frei bei den meisten Setups)
device_instance = 53
; Neustart, wenn so viele Sekunden keine MQTT-Nachricht kam (0 = aus)
timeout = 60

[WALLBOX]
; Ladepunkt-ID in openWB (meist 1). Mehrere kommagetrennt: z.B. 1,2
; -> je Ladepunkt ein eigener Venus-Service (device_instance fortlaufend)
chargepoint_id = 1
; Maximaler Ladestrom in A (16 = 11 kW, 32 = 22 kW)
max_current = 16
; Position: 0 = AC-Ausgang, 1 = AC-Eingang 1, 2 = AC-Eingang 2
position = 1
; Nennspannung fuer Phasen-Leistungsschaetzung, falls openWB keine Spannungen liefert
nominal_voltage = 230

[CONTROL]
; Steuerung aus Venus OS erlauben: 0 = nur Anzeige, 1 = Start/Stop + Strom
enabled = 0
; charge_template-ID (0 = automatisch aus connected_vehicle/config erkennen)
charge_template_id = 0

[WEB]
; Port des Konfigurations-Web-Interface
port = 8088
; Benutzername fuer den optionalen Passwortschutz
username = admin
; SHA-256-Hash des Passworts (leer = kein Schutz).
; Am besten ueber das Web-Interface setzen. Passwort vergessen? Hier leeren.
password_hash =

[MQTT]
; IP/Hostname der openWB (dort laeuft der MQTT-Broker)
broker_address = IP_ADDR_OR_FQDN
broker_port = 1883
; optionale Authentifizierung
username =
password =
; TLS: 0 = aus, 1 = an
tls_enabled = 0
; Root-Topic der openWB (Standard: openWB)
mqtt_root = openWB
